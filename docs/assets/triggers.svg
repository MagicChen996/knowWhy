<svg width="860" height="300" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="knowWhy 触发策略：manual > task_boundary > every_n_turns">
  <defs>
    <style>
      .t { font-family: -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .lead { font-size: 13px; font-weight: 700; }
      .sub  { font-size: 11.5px; }
      .card { font-size: 14px; font-weight: 700; }
      .cond { font-size: 12px; }
      .say  { font-size: 12px; font-style: italic; }
      .pri  { font-size: 11px; font-weight: 700; letter-spacing: .5px; }
    </style>
    <filter id="soft4" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="860" height="300" rx="14" fill="#f8fafc"/>

  <text x="26" y="34" class="t lead" fill="#334155">触发策略 —— 三种触发，可组合</text>
  <text x="26" y="54" class="t sub" fill="#94a3b8">优先级：manual &gt; task_boundary &gt; every_n_turns；每次只走最高优先级的那个</text>

  <!-- manual -->
  <rect x="26" y="72" width="256" height="204" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#soft4)"/>
  <rect x="26" y="72" width="256" height="34" rx="12" fill="#ef4444"/>
  <rect x="26" y="92" width="256" height="14" fill="#ef4444"/>
  <text x="46" y="95" class="t pri" fill="#ffffff">优先级 3 · 最高</text>
  <text x="46" y="132" class="t card" fill="#991b1b">manual · 手动</text>
  <text x="46" y="156" class="t cond" fill="#475569">用户明确要求：</text>
  <text x="46" y="176" class="t cond" fill="#64748b">「讲讲为什么 / 复盘」</text>
  <text x="46" y="195" class="t cond" fill="#64748b">「说下原理 / explain your approach」</text>
  <rect x="42" y="212" width="224" height="48" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <text x="54" y="231" class="t say" fill="#b91c1c">「好的，我把刚才的流程</text>
  <text x="54" y="249" class="t say" fill="#b91c1c">拆开讲一下为什么。」</text>

  <!-- task boundary -->
  <rect x="302" y="72" width="256" height="204" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#soft4)"/>
  <rect x="302" y="72" width="256" height="34" rx="12" fill="#3b82f6"/>
  <rect x="302" y="92" width="256" height="14" fill="#3b82f6"/>
  <text x="322" y="95" class="t pri" fill="#ffffff">优先级 2 · 最高价值</text>
  <text x="322" y="132" class="t card" fill="#1e40af">task_boundary · 任务边界</text>
  <text x="322" y="156" class="t cond" fill="#475569">多步任务刚完成 / 失败</text>
  <text x="322" y="176" class="t cond" fill="#64748b">（≥ 3 步才值得复盘）</text>
  <text x="322" y="195" class="t cond" fill="#64748b">目标还热乎，是最好的时机</text>
  <rect x="318" y="212" width="224" height="48" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="330" y="231" class="t say" fill="#1d4ed8">「花两分钟复盘一下这套流程，</text>
  <text x="330" y="249" class="t say" fill="#1d4ed8">要展开哪一步？还是先跳过？」</text>

  <!-- cadence -->
  <rect x="578" y="72" width="256" height="204" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5" filter="url(#soft4)"/>
  <rect x="578" y="72" width="256" height="34" rx="12" fill="#14b8a6"/>
  <rect x="578" y="92" width="256" height="14" fill="#14b8a6"/>
  <text x="598" y="95" class="t pri" fill="#ffffff">优先级 1 · 安全网</text>
  <text x="598" y="132" class="t card" fill="#115e59">every_n_turns · 每 N 轮</text>
  <text x="598" y="156" class="t cond" fill="#475569">长会话里连续约 8 轮未复盘</text>
  <text x="598" y="176" class="t cond" fill="#64748b">轻量提醒，不打断节奏</text>
  <text x="598" y="195" class="t cond" fill="#64748b">用户回「跳过」则静默一段</text>
  <rect x="594" y="212" width="224" height="48" rx="8" fill="#ffffff" stroke="#99f6e4"/>
  <text x="606" y="231" class="t say" fill="#0f766e">「推进这么久了，抽 1 分钟做个</text>
  <text x="606" y="249" class="t say" fill="#0f766e">know-why？不想的话回「跳过」。」</text>
</svg>
