[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knowwhy"
version = "0.1.0"
description = "Turn an agent's session trace into a structured know-why reflection, so using AI also grows the user."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MagicChen996" }]
keywords = ["agent", "skill", "reflection", "cognitive-offloading", "explainability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Zero runtime dependencies on purpose: the package must install anywhere,
# including inside an agent sandbox where only the stdlib is guaranteed.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/MagicChen996/knowWhy"

[project.scripts]
knowwhy = "knowwhy.cli:main"

[tool.setuptools]
packages = ["knowwhy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
